<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Free Parking</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <style>
    :root {
      --bg: #f3f6f7;
      --panel-bg: #ffffff;
      --text: #1a2328;
      --muted: #5a6b73;
      --blue: #1976d2;
      --green: #2e7d32;
      --border: #d8e0e4;
      --shadow: 0 10px 28px rgba(8, 26, 43, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: "Manrope", "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 18% 10%, #e3f1f5 0, #f3f6f7 42%, #edf3ef 100%);
    }

    .app {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      height: 100%;
      gap: 14px;
      padding: 14px;
    }

    aside {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    h1 {
      font-size: 1.2rem;
      margin: 0 0 16px;
      line-height: 1.28;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    input[type="search"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      outline: none;
      background: #fff;
    }

    input[type="search"]:focus {
      border-color: #7da5be;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.12);
    }

    .street-list {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow: auto;
      flex: 1 1 auto;
      border-top: 1px solid var(--border);
      min-height: 0;
    }

    .street-item {
      border-bottom: 1px solid #edf2f4;
      padding: 10px 0;
      cursor: pointer;
    }

    .street-item:last-child {
      border-bottom: none;
    }

    .street-item.selected {
      background: #fff3f2;
    }

    .street-item:hover .street-lat {
      color: #0f4468;
    }

    .street-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }

    .pill {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-radius: 999px;
      padding: 2px 8px;
      color: #fff;
    }

    .pill.blue {
      background: var(--blue);
    }

    .pill.green {
      background: var(--green);
    }

    .street-cyr {
      font-size: 0.88rem;
      line-height: 1.3;
      margin: 0;
    }

    .street-lat {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 2px 0 0;
      line-height: 1.3;
      transition: color 0.15s;
    }

    .street-note {
      margin-top: 4px;
      font-size: 0.78rem;
      color: #2a4f64;
      line-height: 1.35;
    }

    main {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      min-height: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 520px;
      background: #dfe7ea;
    }

    .leaflet-popup-content {
      margin: 10px 12px;
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .popup-name {
      font-size: 1.6em;
      font-weight: 700;
      line-height: 1.15;
      margin: 0 0 6px;
    }

    .popup-notes {
      margin-top: 6px;
    }

    .popup-note {
      margin: 0 0 8px;
      line-height: 1.35;
    }

    .popup-note:last-child {
      margin-bottom: 0;
    }

    .leaflet-control-location {
      border-radius: 8px;
      overflow: hidden;
    }

    .location-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: #ffffff;
      color: #1d4259;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 10px;
      cursor: pointer;
    }

    .location-btn:hover {
      background: #f0f6fa;
    }

    .location-btn svg {
      width: 14px;
      height: 14px;
      fill: #1976d2;
      display: block;
    }

    @media (max-width: 980px) {
      html,
      body {
        height: 100vh;
        height: 100dvh;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        gap: 0;
        padding: 0;
      }

      aside {
        order: 2;
        flex: 0 0 auto;
        max-height: 45%;
        overflow: hidden;
        border-radius: 0;
        border-top: 1px solid var(--border);
        border-left: none;
        border-right: none;
        border-bottom: none;
        box-shadow: none;
        padding: 14px;
      }

      main {
        order: 1;
        flex: 1 1 auto;
        min-height: 0;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }

      #map {
        height: 100%;
        min-height: 0;
      }

      .leaflet-right .leaflet-control {
        margin-right: 12px;
      }

      .leaflet-bottom .leaflet-control {
        margin-bottom: 12px;
      }
    }
  </style>
</head>

        for (const key of collectPointKeysForStreet(allSegments, id)) {
          endStreetPoints.add(key);
        }
      }

      const startKeys = [...streetPoints].filter((key) => startStreetPoints.has(key));
      const endKeys = [...streetPoints].filter((key) => endStreetPoints.has(key));
      if (startKeys.length === 0 || endKeys.length === 0) {
        return keepNoteOnly();
      }

      const adjacency = buildStreetGraphAdjacency(allSegments, BOGDANA_TIRNANICA_ID);
      const bestPath = findLongestShortestPathBetweenKeySets(
        adjacency,
        startKeys,
        endKeys
      );
      if (!bestPath || bestPath.length < 2) {
        return keepNoteOnly();
      }

      const allowedEdges = pathToAllowedEdges(bestPath);
      const seenPaths = new Set();
      const rewriteSegments = (segments) => {
        const rewritten = [];
        for (const segment of segments) {
          if (!hasStreetId(segment, BOGDANA_TIRNANICA_ID)) {
            rewritten.push(segment);
            continue;
          }

          const parts = splitSegmentByAllowedEdges(
            segment,
            allowedEdges,
            BOGDANA_TIRNANICA_NOTE
          );
          for (const part of parts) {
            const partKey = (part.latLngs || []).map(pointKey).join(">");
            if (!partKey || seenPaths.has(partKey)) continue;
            seenPaths.add(partKey);
            rewritten.push(part);
          }
        }
        return rewritten;
      };

      const trimmed12 = rewriteSegments(segments12);
      const trimmedB1 = rewriteSegments(segmentsB1);
      const trimmedCount = [...trimmed12, ...trimmedB1].filter((segment) =>
        hasStreetId(segment, BOGDANA_TIRNANICA_ID)
      ).length;
      if (trimmedCount === 0) {
        return keepNoteOnly();
      }

      return {
        ...payload,
        segments12: trimmed12,
        segmentsB1: trimmedB1,
      };
    };

    const overrideCvijicevaSegments = (payload) => {
      if (!payload) return payload;
      const segments12 = Array.isArray(payload.segments12) ? payload.segments12 : [];
      const segmentsB1 = Array.isArray(payload.segmentsB1) ? payload.segmentsB1 : [];
      const allSegments = [...segments12, ...segmentsB1];

      const keepNoteOnly = () => {
        const rewrite = (segment) =>
          hasStreetId(segment, CVIJICEVA_ID)
            ? { ...segment, notes: [CVIJICEVA_NOTE] }
            : segment;
        return {
          ...payload,
          segments12: segments12.map(rewrite),
          segmentsB1: segmentsB1.map(rewrite),
        };
      };

      const startKeys = findIntersectionPointKeys(
        allSegments,
        CVIJICEVA_ID,
        CVIJICEVA_START_STREET_ID
      );
      const endKeys = findIntersectionPointKeys(
        allSegments,
        CVIJICEVA_ID,
        CVIJICEVA_END_STREET_ID
      );
      if (startKeys.length === 0 || endKeys.length === 0) {
        return keepNoteOnly();
      }

      const adjacency = buildStreetGraphAdjacency(allSegments, CVIJICEVA_ID);
      const bestPath = findShortestPathBetweenKeySets(adjacency, startKeys, endKeys);
      if (!bestPath || bestPath.length < 2) {
        return keepNoteOnly();
      }

      const allowedEdges = pathToAllowedEdges(bestPath);
      const seenPaths = new Set();
      const rewriteSegments = (segments) => {
        const rewritten = [];
        for (const segment of segments) {
          if (!hasStreetId(segment, CVIJICEVA_ID)) {
            rewritten.push(segment);
            continue;
          }

          const parts = splitSegmentByAllowedEdges(
            segment,
            allowedEdges,
            CVIJICEVA_NOTE
          );
          for (const part of parts) {
            const partKey = (part.latLngs || []).map(pointKey).join(">");
            if (!partKey || seenPaths.has(partKey)) continue;
            seenPaths.add(partKey);
            rewritten.push(part);
          }
        }
        return rewritten;
      };

      const trimmed12 = rewriteSegments(segments12);
      const trimmedB1 = rewriteSegments(segmentsB1);
      const trimmedCount = [...trimmed12, ...trimmedB1].filter((segment) =>
        hasStreetId(segment, CVIJICEVA_ID)
      ).length;
      if (trimmedCount === 0) {
        return keepNoteOnly();
      }

      return {
        ...payload,
        segments12: trimmed12,
        segmentsB1: trimmedB1,
      };
    };

    const applyStreetIdAliases = (payload) => {
      if (!payload) return payload;
      const mapSegment = (segment) => {
        const baseStreetIds = Array.isArray(segment?.streetIds)
          ? segment.streetIds
              .map((value) => Number(value))
              .filter((value) => Number.isFinite(value))
          : [];
        if (baseStreetIds.length === 0) {
          return segment;
        }

        const merged = [...baseStreetIds];
        for (const { sourceId, aliasId } of STREET_ID_ALIASES) {
          const hasSource = merged.some((id) => id === Number(sourceId));
          const hasAlias = merged.some((id) => id === Number(aliasId));
          if (hasSource && !hasAlias) {
            merged.push(Number(aliasId));
          }
        }

        if (merged.length === baseStreetIds.length) {
          return segment;
        }

        return {
          ...segment,
          streetIds: merged,
        };
      };

      return {
        ...payload,
        segments12: (payload.segments12 || []).map(mapSegment),
        segmentsB1: (payload.segmentsB1 || []).map(mapSegment),
      };
    };

    const removePoenkareovaDisplay = (payload) => {
      if (!payload) return payload;

      const rewrite = (segment) => {
        const streetIds = Array.isArray(segment?.streetIds)
          ? segment.streetIds
              .map((value) => Number(value))
              .filter((value) => Number.isFinite(value))
          : [];
        if (!streetIds.some((id) => id === POENKAREOVA_ID)) {
          return segment;
        }

        const nextStreetIds = streetIds.filter((id) => id !== POENKAREOVA_ID);
        if (nextStreetIds.length === 0) {
          return null;
        }

        return {
          ...segment,
          streetIds: nextStreetIds,
        };
      };

      return {
        ...payload,
        segments12: (payload.segments12 || []).map(rewrite).filter(Boolean),
        segmentsB1: (payload.segmentsB1 || []).map(rewrite).filter(Boolean),
      };
    };

    const removeMapHiddenStreetIds = (payload) => {
      if (!payload) return payload;

      const rewrite = (segment) => {
        const streetIds = Array.isArray(segment?.streetIds)
          ? segment.streetIds
              .map((value) => Number(value))
              .filter((value) => Number.isFinite(value))
          : [];
        if (streetIds.length === 0) {
          return segment;
        }

        const nextStreetIds = streetIds.filter(
          (id) => !MAP_HIDDEN_STREET_IDS.has(id)
        );
        if (nextStreetIds.length === streetIds.length) {
          return segment;
        }
        if (nextStreetIds.length === 0) {
          return null;
        }

        return {
          ...segment,
          streetIds: nextStreetIds,
        };
      };

      return {
        ...payload,
        segments12: (payload.segments12 || []).map(rewrite).filter(Boolean),
        segmentsB1: (payload.segmentsB1 || []).map(rewrite).filter(Boolean),
      };
    };

    const injectZorzaKlemensoaSegments = (payload) => {
      if (!payload) return payload;

      const cloneFrom = (segments) => {
        const clones = [];
        for (const segment of segments || []) {
          if (!hasStreetId(segment, ZORZA_KLEMENSOA_SOURCE_STREET_ID)) continue;
          if (!Array.isArray(segment?.latLngs) || segment.latLngs.length < 2) continue;
          clones.push({
            ...segment,
            name: ZORZA_KLEMENSOA_NAME,
            streetIds: [ZORZA_KLEMENSOA_ID],
            notes: [ZORZA_KLEMENSOA_NOTE],
          });
        }
        return clones;
      };

      return {
        ...payload,
        segments12: [...(payload.segments12 || []), ...cloneFrom(payload.segments12 || [])],
        segmentsB1: [...(payload.segmentsB1 || []), ...cloneFrom(payload.segmentsB1 || [])],
      };
    };

    const expandStreetIdsByAliases = (ids) => {
      const expanded = new Set(
        (ids || []).map((id) => Number(id)).filter((id) => Number.isFinite(id))
      );
      let changed = true;
      while (changed) {
        changed = false;
        for (const { sourceId, aliasId } of STREET_ID_ALIASES) {
          const source = Number(sourceId);
          const alias = Number(aliasId);
          if (expanded.has(source) && !expanded.has(alias)) {
            expanded.add(alias);
            changed = true;
          }
          if (expanded.has(alias) && !expanded.has(source)) {
            expanded.add(source);
            changed = true;
          }
        }
      }
      return [...expanded];
    };

    const parseStreetData = (raw) => {
      const rows = raw.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      return rows
        .map((line) => {
          const match = line.match(/^(\d+),([^,]+),([^,]+),([^,]+),(.*)$/);
          if (!match) {
            return null;
          }

          const [, id, nameCyr, nameLat, zoneRaw, noteRaw] = match;
          const zone = zoneRaw.trim();
          const note = noteRaw.trim().replace(/^"(.*)"$/, "$1");

          return {
            id: Number(id),
            nameCyr: nameCyr.trim(),
            nameLat: nameLat.trim(),
            zone,
            note,
          };
        })
        .filter(Boolean);
    };

    const popupHtml = (name, zone, notes) => {
      const noteSet = new Set((notes || []).filter(Boolean));
      const noteBlock =
        noteSet.size > 0
          ? `<div class="popup-notes">${[...noteSet]
              .map((note) => `<p class="popup-note">${note}</p>`)
              .join("")}</div>`
          : "";

      return `
        <h1 class="popup-name">${name || "Без названия"}</h1>
        <div><strong>Зона:</strong> ${zone}</div>
        ${noteBlock}
      `;
    };

    const streets = parseStreetData(rawStreetData).filter(
      (street) =>
        street.id !== CARA_UROSA_ZONE12_ID &&
        street.id !== DESPOTA_STEFANA_ZONE12_ID &&
        street.id !== POENKAREOVA_ID &&
        street.id !== SKADARSKA_ZONE12_ID
    );
    const searchableStreets = streets.map((street) => ({
      ...street,
      searchKey: [
        normalizeKey(street.nameCyr),
        normalizeKey(street.nameLat),
        normalizeKey(street.note),
      ].join("|"),
    }));
    const streetsById = new Map(streets.map((street) => [street.id, street]));
    const streetIdsByNameKey = new Map();
    const getStreetNameKeys = (street) => {
      const keys = new Set();
      for (const name of [street?.nameCyr, street?.nameLat]) {
        for (const key of streetNameKeyVariants(name)) {
          keys.add(key);
        }
      }
      return [...keys];
    };
    for (const street of streets) {
      for (const key of getStreetNameKeys(street)) {
        if (!streetIdsByNameKey.has(key)) {
          streetIdsByNameKey.set(key, new Set());
        }
        streetIdsByNameKey.get(key).add(street.id);
      }
    }

    const normalizeStoredPayload = (parsed) => {
      if (!parsed || !Array.isArray(parsed.segments12) || !Array.isArray(parsed.segmentsB1)) {
        return null;
      }

      if (parsed.segments12.length + parsed.segmentsB1.length === 0) {
        return null;
      }

      return {
        segments12: parsed.segments12,
        segmentsB1: parsed.segmentsB1,
        found12: new Set(parsed.found12 || []),
        foundB1: new Set(parsed.foundB1 || []),
        zone12Added: parsed.segments12.length,
        zoneB1Added: parsed.segmentsB1.length,
        bboxLabel: parsed.bboxLabel || "offline",
        savedAt: parsed.savedAt || null,
        source: parsed.source || "offline",
      };
    };

    const renderStreetList = (filterText = "") => {
      const needle = normalizeKey(filterText);
      const filtered = needle
        ? searchableStreets.filter((street) => street.searchKey.includes(needle))
        : searchableStreets;

      streetListEl.innerHTML = filtered
        .map((street) => {
          const isSelected = selectedListStreetId === street.id;
          return `
            <li class="street-item${isSelected ? " selected" : ""}" data-street-id="${street.id}">
              <div class="street-head">
                <p class="street-cyr">${street.nameCyr}</p>
              </div>
              <p class="street-lat">${street.nameLat}</p>
              ${street.note ? `<div class="street-note">${street.note}</div>` : ""}
            </li>
          `;
        })
        .join("");
    };

    const streetIdsContainSelection = (streetIds) => {
      if (!Array.isArray(streetIds)) return false;
      return streetIds.some((id) => selectedStreetIds.has(Number(id)));
    };

    const applySelectedStreetStyle = () => {
      for (const item of streetPolylines) {
        const baseStyle = zoneStyles[item.zone];
        if (!baseStyle) continue;

        const isSelected = streetIdsContainSelection(item.streetIds);

        item.polyline.setStyle({
          color: isSelected ? "#e53935" : baseStyle.color,
          weight: isSelected ? baseStyle.weight + 3 : baseStyle.weight,
          opacity: isSelected ? 0.75 : baseStyle.opacity,
        });
      }
    };

    const findPopupPolylineForStreet = (streetId) => {
      const byStreetId = streetPolylines.find((item) => {
        if (!Array.isArray(item.streetIds)) return false;
        return item.streetIds.some((id) => Number(id) === Number(streetId));
      });
      if (byStreetId) {
        return byStreetId.polyline;
      }

      const bySelection = streetPolylines.find((item) => streetIdsContainSelection(item.streetIds));
      return bySelection ? bySelection.polyline : null;
    };

    const openPopupForStreetSelection = (streetId) => {
      const polyline = findPopupPolylineForStreet(streetId);
      if (!polyline) {
        return false;
      }
      polyline.openPopup();
      return true;
    };

    const scrollStreetListToItem = (streetId) => {
      const streetItem = streetListEl.querySelector(`.street-item[data-street-id="${streetId}"]`);
      if (streetItem) {
        streetItem.scrollIntoView({ block: "nearest" });
      }
    };

    const getSelectionStreetIds = (listStreetId) => {
      const street = streetsById.get(listStreetId);
      if (!street) {
        return expandStreetIdsByAliases([listStreetId]);
      }

      const candidateIds = new Set();
      for (const key of getStreetNameKeys(street)) {
        for (const id of streetIdsByNameKey.get(key) || []) {
          candidateIds.add(id);
        }
      }
      if (candidateIds.size === 0) {
        candidateIds.add(listStreetId);
      }

      const expandedIds = expandStreetIdsByAliases([...candidateIds]);
      const withGeometry = expandedIds.filter((id) => streetBoundsById.has(id));
      if (withGeometry.length > 0) {
        return withGeometry;
      }

      return expandedIds;
    };

    const resolveSegmentStreetId = (segment) => {
      const segmentStreetIds = (segment?.streetIds || [])
        .map((value) => Number(value))
        .filter((value) => Number.isFinite(value));
      const existingId = segmentStreetIds.find((id) => streetsById.has(id));
      if (Number.isFinite(existingId)) {
        return existingId;
      }

      for (const key of streetNameKeyVariants(segment?.name || "")) {
        const ids = streetIdsByNameKey.get(key);
        if (ids && ids.size > 0) {
          return [...ids][0];
        }
      }
      return null;
    };

    const selectStreet = (streetId, options = {}) => {
      if (!Number.isFinite(streetId)) {
        return;
      }
      selectedListStreetId = streetId;
      const idsToSelect = getSelectionStreetIds(streetId);
      selectedStreetIds.clear();
      for (const id of idsToSelect) {
        selectedStreetIds.add(Number(id));
      }
      applySelectedStreetStyle();
      const items = streetListEl.querySelectorAll(".street-item");
      for (const item of items) {
        item.classList.toggle("selected", Number(item.dataset.streetId) === selectedListStreetId);
      }
      if (options.scrollList) {
        scrollStreetListToItem(selectedListStreetId);
      }
    };

    const bindListEvents = () => {
      streetListEl.addEventListener("click", (event) => {
        const item = event.target.closest(".street-item");
        if (!item) return;

        const streetId = Number(item.dataset.streetId);
        selectStreet(streetId);
        const bounds = L.latLngBounds([]);
        for (const id of selectedStreetIds) {
          const segmentBounds = streetBoundsById.get(id);
          if (segmentBounds && segmentBounds.isValid()) {
            bounds.extend(segmentBounds);
          }
        }

        if (bounds && bounds.isValid()) {
          let popupOpened = false;
          const tryOpenPopup = () => {
            if (popupOpened) return;
            popupOpened = openPopupForStreetSelection(streetId);
          };
          map.once("moveend", tryOpenPopup);
          map.fitBounds(bounds.pad(0.24), { maxZoom: 19, animate: true });
          window.setTimeout(tryOpenPopup, 260);
        } else {
          showMapMessage("Для выбранной улицы нет офлайн-геометрии.");
        }
      });

      streetFilterEl.addEventListener("input", (event) => {
        renderStreetList(event.target.value || "");
      });
    };

    const renderSegment = (segment, zoneLayer) => {
      if (!Array.isArray(segment?.latLngs) || segment.latLngs.length < 2) {
        return false;
      }

      const style = zoneStyles[segment.zone];
      if (!style) return false;

      L.polyline(segment.latLngs, {
        color: "#ffffff",
        weight: style.weight + 4,
        opacity: 0.82,
        lineJoin: "round",
        lineCap: "round",
      }).addTo(zoneLayer);

      const polyline = L.polyline(segment.latLngs, {
        color: style.color,
        weight: style.weight,
        opacity: style.opacity,
        lineJoin: "round",
        lineCap: "round",
      }).addTo(zoneLayer);
      streetPolylines.push({
        polyline,
        zone: segment.zone,
        streetIds: Array.isArray(segment.streetIds) ? segment.streetIds : [],
      });

      polyline.bindPopup(popupHtml(segment.name, segment.zone, segment.notes));
      polyline.on("click", () => {
        const streetId = resolveSegmentStreetId(segment);
        if (streetId !== null) {
          selectStreet(streetId, { scrollList: true });
        }
      });

      const segmentBounds = polyline.getBounds();
      for (const streetId of segment.streetIds || []) {
        const current = streetBoundsById.get(streetId);
        if (!current) {
          streetBoundsById.set(streetId, segmentBounds);
        } else {
          current.extend(segmentBounds);
        }
      }

      return true;
    };

    const renderSegments = (segments12, segmentsB1) => {
      layer12.clearLayers();
      layerB1.clearLayers();
      streetBoundsById.clear();
      streetPolylines.length = 0;

      for (const segment of segments12 || []) {
        renderSegment(segment, layer12);
      }

      for (const segment of segmentsB1 || []) {
        renderSegment(segment, layerB1);
      }

      applySelectedStreetStyle();
    };

    const fitMapToVisibleStreets = () => {
      const allBounds = L.latLngBounds([]);
      if (layer12.getLayers().length > 0) {
        allBounds.extend(layer12.getBounds());
      }
      if (layerB1.getLayers().length > 0) {
        allBounds.extend(layerB1.getBounds());
      }

      if (allBounds.isValid()) {
        map.fitBounds(allBounds.pad(0.08), { maxZoom: 15 });
      }
    };

    const loadOfflineFile = () => {
      const embedded = normalizeStoredPayload(window.BELGRADE_OFFLINE_DATA);
      return embedded || null;
    };

    const loadMapData = async () => {
      renderStreetList();
      bindListEvents();

      try {
        const offlineFileData = loadOfflineFile();
        if (!offlineFileData) {
          throw new Error("Offline file missing or empty");
        }
        const aliasedData = applyStreetIdAliases(offlineFileData);
        const preparedData = overrideBulevarVojvodeBojovicaSegments(
          overridePjaronaDeMondeziraSegments(
            overrideKneginjeLjubiceB1Segments(
              overrideSkadarskaB1Segments(
                overrideCetinjskaSegments(
                  overrideVlajkovicevaSegments(
                overrideNusicevaSegments(
                  overrideBogdanaTirnanicaSegments(
                        overrideKneginjeLjubiceZone12Segments(
                          overrideKraljaPetraSegments(aliasedData)
                        )
                      )
                    )
                  )
                )
              )
            )
          )
        );
        const normalizedData = overrideCvijicevaSegments(
          overrideDunavskaSegments(
            overrideDespotaStefanaSegments(
              overridePoenkareovaSegments(
                overrideVojvodeDobrnjcaSegments(
                  overrideCaraUrosaSegments(preparedData)
                )
              )
            )
          )
        );
        const finalData = removeMapHiddenStreetIds(
          injectZorzaKlemensoaSegments(
            removePoenkareovaDisplay(normalizedData)
          )
        );
        renderSegments(finalData.segments12, finalData.segmentsB1);
        fitMapToVisibleStreets();
        invalidateMapSize();
      } catch (error) {
        console.error(error);
      }
    };

    loadMapData();
  </script>
</body>
</html>
